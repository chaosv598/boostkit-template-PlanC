name: Patch Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install PyYAML
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest lint
        run: bash .ci/patch-tools/apply_patch.sh lint
      - name: Verify default sequence
        run: bash .ci/patch-tools/apply_patch.sh verify
      - name: Verify one feature
        run: bash .ci/patch-tools/apply_patch.sh verify
        env:
          ENABLED_FEATURES: arm64-neon
      - name: Verify all example features
        run: bash .ci/patch-tools/apply_patch.sh verify
        env:
          ENABLED_FEATURES: arm64-neon,kunpeng-runtime
